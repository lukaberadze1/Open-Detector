# Builds the Windows download on GitHub's Windows machines and checks it there. Publishing a release adds
# Open-Detector-Setup.exe to it; "Run workflow" on the Actions page builds it for download from the run.
name: Windows app

on:
  workflow_dispatch:
  push:
    branches: [feat/windows-app]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Run the tests on Windows
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv\Scripts\python.exe -r requirements.txt -c deploy\windows\constraints.txt
          .venv\Scripts\python.exe -m pytest -q
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        run: uv run --no-project --python 3.12 python deploy\windows\build_app.py
      - name: Check the installer
        run: .\deploy\windows\smoke_test.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-detector-windows
          path: |
            dist/Open-Detector-Setup.exe
            dist/smoke
          compression-level: 0
      - name: Add it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist\Open-Detector-Setup.exe --clobber
