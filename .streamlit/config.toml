# The app's look: Inter, soft corners and an indigo accent, with a light and a dark palette. Viewers
# switch between them in the app's settings menu; the default follows their system.

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.7rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5F9"
textColor = "#171A26"
borderColor = "#E1E3EB"
linkColor = "#4F46E5"

[theme.light.sidebar]
backgroundColor = "#F7F8FB"

[theme.dark]
primaryColor = "#8B93FF"
backgroundColor = "#0D0F16"
secondaryBackgroundColor = "#181B25"
textColor = "#E7E9F0"
borderColor = "#272B38"
linkColor = "#A5ACFF"

[theme.dark.sidebar]
backgroundColor = "#11131B"
