# The app's base theme, which every one of Streamlit's own widgets takes its colours from: sliders, links,
# spinners, progress bars, tables, pop-overs. It is Bistro's (cream paper, espresso ink, paprika), the default
# look, with a light and a dark palette; viewers switch light/dark in the app's settings menu (the default
# follows their system). ui/style.py layers the active look on top: Bistro's details, or Glass, which repaints
# the widgets it can in its own violet (tables keep these colours in both looks).

[theme]
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
headingFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
headingFontWeights = [800, 700, 700, 700, 700, 700]
baseRadius = "0.85rem"
buttonRadius = "0.7rem"
showWidgetBorder = true
showSidebarBorder = false

[theme.light]
primaryColor = "#C2410C"
backgroundColor = "#F8F1E4"
secondaryBackgroundColor = "#F2E8D6"
textColor = "#2A1F17"
borderColor = "#E7DAC4"
linkColor = "#C2410C"

[theme.light.sidebar]
backgroundColor = "#F2E8D6"

[theme.dark]
primaryColor = "#EA6A2E"
backgroundColor = "#18120E"
secondaryBackgroundColor = "#2A2019"
textColor = "#F3E7D3"
borderColor = "#3B2E24"
linkColor = "#F08A55"

[theme.dark.sidebar]
backgroundColor = "#1F1712"
