<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
// Keeps one value in this browser's own storage for the app (ui/device_storage.py). Asked to store, forget
// or read it, it does so and answers with what is stored. It talks only to the app that embeds it, on this
// same site: another site embedding this page could otherwise ask it for the value.
const origin = window.location.origin;
let last;

function send(type, data) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, data), origin);
}

window.addEventListener("message", (event) => {
  if (event.origin !== origin || event.source !== window.parent) return;
  if (!event.data || event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};
  const item = "open-detector:" + args.name;
  let now = "";
  try {
    if (args.action === "store" && args.value) localStorage.setItem(item, args.value);
    if (args.action === "forget") localStorage.removeItem(item);
    now = localStorage.getItem(item) || "";
  } catch (error) {
    now = "";  // storage blocked (a private window, or site data turned off): nothing is kept
  }
  if (now !== last) {
    last = now;
    send("streamlit:setComponentValue", {value: now, dataType: "json"});
  }
});

send("streamlit:componentReady", {apiVersion: 1});
send("streamlit:setFrameHeight", {height: 0});
</script>
</body>
</html>
